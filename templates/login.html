{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 mt-5 rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                         style="width: 70px; height: 70px;">
                        <i class="bi bi-person-circle fs-2"></i>
                    </div>
                    <h2 class="fw-bold mb-1">User / Customer Login</h2>
                    <p class="text-muted small mb-0">Sign in to shop, track orders and write reviews.</p>
                </div>

                <form action="{{ url_for('login') }}" method="POST">
                    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Username</label>
                        <input type="text" name="username" value="{{ username }}" class="form-control"
                               autocomplete="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" name="password" class="form-control"
                               autocomplete="current-password" required>
                    </div>
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" name="remember" id="remember">
                        <label class="form-check-label" for="remember">Keep me signed in</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </button>
                </form>

                <hr class="my-4">
                <p class="text-center text-muted mb-1">
                    Don't have an account? <a href="{{ url_for('register') }}" class="fw-bold">Register</a>
                </p>
                <p class="text-center text-muted mb-0 small">
                    Store owner? <a href="{{ url_for('admin_login') }}" class="fw-bold">Admin login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
