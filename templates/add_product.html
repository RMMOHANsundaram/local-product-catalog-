{% extends 'base.html' %}
{% block title %}Add Product{% endblock %}
{% block content %}
<div class="card shadow-sm border-0 mx-auto rounded-4" style="max-width: 820px;">
    <div class="card-header bg-transparent py-3">
        <h3 class="fw-bold mb-0"><i class="bi bi-plus-circle"></i> Add new product</h3>
    </div>
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('add_product') }}" enctype="multipart/form-data">
            <input type="hidden" name="_csrf" value="{{ csrf_token() }}">

            <div class="row mb-3">
                <div class="col-md-8">
                    <label class="form-label fw-bold">Product name *</label>
                    <input type="text" class="form-control" name="name" value="{{ form.get('name', '') }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Category *</label>
                    <select class="form-select" name="category" required>
                        {% for cat in CATEGORIES %}
                        <option value="{{ cat }}" {% if form.get('category') == cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Description</label>
                <textarea class="form-control" name="description" rows="3">{{ form.get('description', '') }}</textarea>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold">Price (₹) *</label>
                    <input type="number" step="0.01" min="0" class="form-control" name="price"
                           value="{{ form.get('price', '') }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Quantity *</label>
                    <input type="number" min="0" class="form-control" name="quantity"
                           value="{{ form.get('quantity', '') }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Availability *</label>
                    <select class="form-select" name="availability" required>
                        <option value="Yes" {% if form.get('availability') != 'No' %}selected{% endif %}>Yes</option>
                        <option value="No" {% if form.get('availability') == 'No' %}selected{% endif %}>No</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Seller name</label>
                    <input type="text" class="form-control" name="seller_name" value="{{ form.get('seller_name', '') }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Shop name</label>
                    <input type="text" class="form-control" name="shop_name" value="{{ form.get('shop_name', '') }}">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Location</label>
                    <input type="text" class="form-control" name="location" value="{{ form.get('location', '') }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Phone</label>
                    <input type="tel" class="form-control" name="phone" value="{{ form.get('phone', '') }}">
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Product photo</label>
                    <input type="file" name="image" accept="image/*" class="form-control">
                    <small class="text-muted">PNG/JPG/GIF/WEBP, max 2 MB.</small>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">…or image URL</label>
                    <input type="url" class="form-control" name="image_url" value="{{ form.get('image_url', '') }}"
                           placeholder="https://example.com/photo.jpg">
                    <small class="text-muted">Leave both blank for a placeholder image.</small>
                </div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg fw-bold">Save product</button>
                <a href="{{ url_for('admin_products') }}" class="btn btn-light border">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
