{% extends 'base.html' %}
{% block title %}{{ code }} · {{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-7 text-center">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-5">
                <h1 class="display-1 fw-bold text-primary mb-2">{{ code }}</h1>
                <h3 class="fw-bold mb-3">{{ title }}</h3>
                <p class="text-secondary mb-4">{{ message }}</p>
                <a href="{{ url_for('index') }}" class="btn btn-primary px-4 fw-bold rounded-pill">
                    <i class="bi bi-house-door"></i> Back to Home
                </a>
                <a href="{{ url_for('products') }}" class="btn btn-outline-secondary px-4 fw-bold rounded-pill">
                    Browse Products
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
